image:
  repository: poc-asr1/ingest-ms
  tag: "0.2.0"
  pullPolicy: IfNotPresent

# Perfil reducido en proporción (ADR 0006). Límite 2000m como producción (la JVM ve 2 CPUs); request 100m, ver ADR 0006 enmiendas 3-4. En AWS: 200m / 2000m y 3096Mi.
resources:
  requests: { cpu: 200m, memory: 1Gi }
  limits:   { cpu: 2000m, memory: 1Gi }
javaOpts: "-Xss256k -Xmx512m -Xms512m -XX:+UseG1GC"

# HPA idéntico al observado en producción (ADR 0004).
autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 8
  targetCPUUtilizationPercentage: 80
  behavior:
    scaleUp:   { stabilizationWindowSeconds: 0,   pods: 4, periodSeconds: 90 }
    scaleDown: { stabilizationWindowSeconds: 300, pods: 4, periodSeconds: 90 }
replicaCount: 4            # solo se usa si autoscaling.enabled=false (escenario P0)

serviceAccount:
  create: false            # en AWS: true, con la anotación del rol IRSA (ver values-aws.yaml)
  annotations: {}
nodeSelector: {}
tolerations: []

service:
  annotations: {}
  type: NodePort
  port: 8080
  nodePort: 30080

config:
  queueUrl: ""
  sqsEndpoint: ""          # vacío en AWS
  sqsTimeoutMs: "2000"
  sqsMaxConcurrency: "200"
  sendLogLevel: INFO       # nivel del log por petición del publicador (experimento de rendimiento: WARN)
  region: us-east-1
  # Solo para LocalStack. En AWS se usa el rol del pod (IRSA) y esto queda vacío.
  localAwsCredentials: false

# Secreto HMAC: se pasa con --set hmacSecret=... (nunca se versiona).
hmacSecret: ""

# Variables de entorno extra (experimentos de rendimiento), p. ej. SPRING_THREADS_VIRTUAL_ENABLED: "false"
extraEnv: {}
