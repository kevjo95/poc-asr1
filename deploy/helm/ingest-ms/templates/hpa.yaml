{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ingest-ms.name" . }}
  labels: {{- include "ingest-ms.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ingest-ms.name" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.autoscaling.behavior.scaleUp.stabilizationWindowSeconds }}
      selectPolicy: Max
      policies:
        - { type: Pods, value: {{ .Values.autoscaling.behavior.scaleUp.pods }}, periodSeconds: {{ .Values.autoscaling.behavior.scaleUp.periodSeconds }} }
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.autoscaling.behavior.scaleDown.stabilizationWindowSeconds }}
      selectPolicy: Max
      policies:
        - { type: Pods, value: {{ .Values.autoscaling.behavior.scaleDown.pods }}, periodSeconds: {{ .Values.autoscaling.behavior.scaleDown.periodSeconds }} }
{{- end }}
