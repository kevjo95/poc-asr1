{{- if not .Values.hmacSecret }}{{ fail "hmacSecret es obligatorio: --set hmacSecret=..." }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ingest-ms.name" . }}-hmac
  labels: {{- include "ingest-ms.labels" . | nindent 4 }}
type: Opaque
stringData:
  INGEST_HMAC_SECRET: {{ .Values.hmacSecret | quote }}
