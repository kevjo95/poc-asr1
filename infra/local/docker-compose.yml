# LocalStack comunitario (sin token) para emular SQS, DynamoDB y Lambda.
services:
  localstack:
    image: localstack/localstack:3
    container_name: poc-asr1-localstack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: sqs,dynamodb,lambda,iam,sts,logs
      DEBUG: "0"
      LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
